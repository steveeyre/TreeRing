<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EFF1EA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>小年轮 · AI 育儿秘书</title>
    <style>
      /* Paint paper shell before JS loads — avoids white flash on cold start. */
      html, body, #root {
        margin: 0;
        height: 100%;
        background: #eff1ea;
        color: #26302a;
      }
      #boot {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      #boot .mark { color: #3f6b51; display: block; }
      #boot .txt {
        font-family: 'Songti SC', 'Noto Serif SC', 'SimSun', serif;
        font-size: 17px;
        letter-spacing: 0.02em;
        color: #26302a;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <svg class="mark" width="48" height="48" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="1.25" opacity="0.28" />
          <circle cx="16" cy="16" r="10" stroke="currentColor" stroke-width="1.75" opacity="0.55" />
          <circle cx="16" cy="16" r="6" stroke="currentColor" stroke-width="2.5" opacity="0.85" />
          <circle cx="16" cy="16" r="1.5" fill="currentColor" />
        </svg>
        <div class="txt">小年轮</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
